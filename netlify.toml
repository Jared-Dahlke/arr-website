[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS are not content-fingerprinted, so they must revalidate on every
# load (ETag makes this cheap) — a max-age here serves stale styles for an
# hour after each deploy.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Old GoHighLevel site URLs -> matching sections of the new single-page site.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/#estimate"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/roofing-services"
  to = "/#services"
  status = 301

# The Netlify subdomain should never compete with the real domain.
[[redirects]]
  from = "https://arr284736.netlify.app/*"
  to = "https://alabamareliableroofing.com/:splat"
  status = 301
  force = true
